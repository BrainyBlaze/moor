[package]
name = "moor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
bytes = "1"
crossbeam-channel = "0.5"
crc32c = "0.6.8"
fs2 = "0.4"
getrandom = "0.3"
interprocess = "=2.4.2"
libc = "0.2"
path-absolutize = "=3.1.1"
rayon = "1"
rustpython-wtf8 = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
time = { version = "0.3", default-features = false, features = ["macros", "parsing"] }
zerocopy = { version = "0.8", features = ["derive"] }
uuid = "=1.18.1"

[target.'cfg(unix)'.dependencies]
close_fds = "=0.3.2"
nix = { version = "0.30", features = ["dir", "poll", "term", "user"] }
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-permissions = "=0.2.4"
windows-spawn = { version = "=0.1.0", path = "vendor/windows-spawn" }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
wmi = { version = "0.18.4", default-features = false }

[[bin]]
name = "moor"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
