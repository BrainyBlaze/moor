name: Hosted quality

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: hosted-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Ubuntu 22.04 x64 / strict quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust with quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check whitespace in the event range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git diff --check "$BASE_SHA" HEAD

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all-target tests
        run: cargo test --all-targets --all-features

      - name: Verify the reviewed handoff hashes
        run: |
          cd spec
          sha256sum --check --strict <<'SUMS'
          05f644d676beaa73d3bcd7a3aef6fb5c715ed53babf853333bb364bf37063433  moor-spec.md
          8cc57dca672929ffab5d869e4c883d0e28d89070df9aa2fd619558a5f766869b  moor-wire-schema.md
          SUMS
          # The literal README table cells intentionally include Markdown backticks.
          # shellcheck disable=SC2016
          grep -F '`moor-spec.md` | `05f644d676beaa73d3bcd7a3aef6fb5c715ed53babf853333bb364bf37063433`' README.md
          # shellcheck disable=SC2016
          grep -F '`moor-wire-schema.md` | `8cc57dca672929ffab5d869e4c883d0e28d89070df9aa2fd619558a5f766869b`' README.md

      - name: Build both release command names
        run: cargo build --release --bin moor --bin atch

  production-loc:
    name: Production LOC / hard maximum 12,000
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install stable Rust with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Count first-party production source
        run: scripts/count-production-loc.sh

  compile-evidence:
    name: Compile evidence only / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install stable Rust and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Label the evidence boundary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          printf '%s\n' '### Compile evidence only' '' \
            "Target: \`$TARGET\`" '' \
            'This job is not native conformance evidence.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check all targets without claiming native conformance
        env:
          TARGET: ${{ matrix.target }}
        run: cargo check --all-targets --all-features --target "$TARGET"
