name: Hosted native evidence

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: hosted-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EVIDENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-posix:
    name: Native hosted / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu-22.04-x64
            runner: ubuntu-22.04
          - lane: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
          - lane: macos-15-intel
            runner: macos-15-intel
          - lane: macos-15-arm64
            runner: macos-15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Initialize the evidence directory
        env:
          LANE: ${{ matrix.lane }}
        run: |
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EVIDENCE_COMMIT"
          out="ci-output/$LANE"
          mkdir -p "$out"
          {
            printf 'commit=%s\n' "$actual_commit"
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            printf 'arch=%s\n' "$RUNNER_ARCH"
            uname -a
          } > "$out/identity.txt"

      - name: Build the release command
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          cargo build --release --bin moor 2>&1 | tee "ci-output/$LANE/build.log"

      - name: Package, hash, and smoke the release command
        env:
          LANE: ${{ matrix.lane }}
        run: |
          out="ci-output/$LANE"
          cp target/release/moor "$out/moor"
          (
            cd "$out"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum moor
            else
              shasum -a 256 moor
            fi > SHA256SUMS
          )
          {
            "$out/moor" --version
            "$out/moor" --help
          } >> "$out/smoke.log" 2>&1
          cat "$out/SHA256SUMS" "$out/smoke.log"

      - name: Run all applicable real-process tests
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          cargo test --release --all-targets 2>&1 | tee "ci-output/$LANE/test.log"

      - name: Upload logs, binaries, and artifact identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-output/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 14

  native-windows:
    name: Native hosted / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: windows-2022-x64
            runner: windows-2022
          - lane: windows-11-arm64
            runner: windows-11-arm
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Initialize the evidence directory
        shell: pwsh
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:EVIDENCE_COMMIT) {
            Write-Error "checked out $actualCommit instead of $env:EVIDENCE_COMMIT"
            exit 1
          }
          $out = "ci-output/${{ matrix.lane }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          @(
            "commit=$actualCommit"
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
            "arch=$env:RUNNER_ARCH"
            "platform=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          ) | Set-Content -Encoding utf8NoBOM "$out/identity.txt"

      - name: Build the release command
        shell: pwsh
        run: |
          $out = "ci-output/${{ matrix.lane }}"
          cargo build --release --bin moor *>&1 | Tee-Object -FilePath "$out/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package, hash, and smoke the release command
        shell: pwsh
        run: |
          $out = "ci-output/${{ matrix.lane }}"
          Copy-Item target/release/moor.exe "$out/moor.exe"
          & ./ci/audit-windows-imports.ps1 -Executable "$out/moor.exe" -Output "$out/imports.txt"
          $hashes = foreach ($file in @("$out/moor.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          [System.IO.File]::WriteAllText("$out/SHA256SUMS", (($hashes -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding $false))
          # Fail fast if SHA256SUMS is not portable to the Linux release-candidate aggregation (#27).
          $sumsBytes = [System.IO.File]::ReadAllBytes("$out/SHA256SUMS")
          if ($sumsBytes -contains 13) {
            Write-Error "SHA256SUMS contains a CR byte (0x0D); it must be LF-only so Linux 'sha256sum -c' resolves moor.exe"
            exit 1
          }
          foreach ($line in (Get-Content "$out/SHA256SUMS")) {
            if ($line -eq "") { continue }
            if ($line -notmatch '^[0-9a-f]{64}  moor\.exe$') {
              Write-Error "SHA256SUMS line is not '<sha256>  moor.exe': $line"
              exit 1
            }
          }
          & "$out/moor.exe" --version *>> "$out/smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$out/moor.exe" --help *>> "$out/smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$out/SHA256SUMS"
          Get-Content "$out/smoke.log"

      - name: Run exact supervised-launch diagnostic witness
        id: focused_supervised_launch_diagnostic
        if: matrix.lane == 'windows-2022-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "ci-output/${{ matrix.lane }}"
          cargo test --test windows launch_paths::malformed_supervised_selector_uses_exact_cause -- --exact --nocapture *>&1 | Tee-Object -FilePath "$out/focused-supervised-launch-diagnostic.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact authenticated-status probe witness
        id: focused_authenticated_status_probe
        if: matrix.lane == 'windows-2022-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "ci-output/${{ matrix.lane }}"
          cargo test --test windows launch_paths::authenticated_status_probe_reports_event_identity -- --exact --nocapture *>&1 | Tee-Object -FilePath "$out/focused-authenticated-status-probe.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all applicable real-process tests
        id: full_release_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "ci-output/${{ matrix.lane }}"
          cargo test --release --all-targets *>&1 | Tee-Object -FilePath "$out/test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require all applicable Windows evidence
        if: always()
        shell: pwsh
        env:
          LANE: ${{ matrix.lane }}
          FOCUSED_SUPERVISED_LAUNCH_DIAGNOSTIC: ${{ steps.focused_supervised_launch_diagnostic.outcome }}
          FOCUSED_AUTHENTICATED_STATUS_PROBE: ${{ steps.focused_authenticated_status_probe.outcome }}
          FULL_RELEASE_TESTS: ${{ steps.full_release_tests.outcome }}
        run: |
          $failed = $false
          if ($env:FULL_RELEASE_TESTS -ne "success") {
            Write-Error "full release tests outcome was $env:FULL_RELEASE_TESTS"
            $failed = $true
          }
          if ($env:LANE -eq "windows-2022-x64" -and $env:FOCUSED_SUPERVISED_LAUNCH_DIAGNOSTIC -ne "success") {
            Write-Error "supervised-launch diagnostic outcome was $env:FOCUSED_SUPERVISED_LAUNCH_DIAGNOSTIC"
            $failed = $true
          }
          if ($env:LANE -eq "windows-2022-x64" -and $env:FOCUSED_AUTHENTICATED_STATUS_PROBE -ne "success") {
            Write-Error "authenticated-status probe outcome was $env:FOCUSED_AUTHENTICATED_STATUS_PROBE"
            $failed = $true
          }
          if ($failed) { exit 1 }

      - name: Upload logs, binaries, and artifact identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-output
          if-no-files-found: error
          retention-days: 14

  native-alpine:
    name: Native hosted / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: alpine-3.20-x64
            runner: ubuntu-22.04
          - lane: alpine-3.20-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify the exact commit
        run: |
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EVIDENCE_COMMIT"

      - name: Build, hash, smoke, and test inside Alpine 3.20
        env:
          LANE: ${{ matrix.lane }}
        run: |
          docker run --rm \
            -e EVIDENCE_COMMIT \
            -e LANE \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:3.20 /bin/sh -ec '
              set -o pipefail
              apk add --no-cache build-base ca-certificates rustup
              export CARGO_HOME=/opt/cargo
              export RUSTUP_HOME=/opt/rustup
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup-init -y --no-modify-path --profile minimal --default-toolchain stable
              out="ci-output/$LANE"
              mkdir -p "$out"
              {
                printf "commit=%s\n" "$EVIDENCE_COMMIT"
                printf "alpine=%s\n" "$(cat /etc/alpine-release)"
                printf "arch=%s\n" "$(uname -m)"
                uname -a
              } > "$out/identity.txt"
              cargo build --release --bin moor 2>&1 | tee "$out/build.log"
              cp target/release/moor "$out/moor"
              (cd "$out" && sha256sum moor > SHA256SUMS)
              {
                "$out/moor" --version
                "$out/moor" --help
              } >> "$out/smoke.log" 2>&1
              cat "$out/SHA256SUMS" "$out/smoke.log"
              cargo test --release --all-targets 2>&1 | tee "$out/test.log"
            '

      - name: Upload logs, binaries, and artifact identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-output/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 14
