name: Release candidate

# Implements docs/release-manifest-v1.md and docs/release-matrix.md:
# build each of the four targets exactly once, establish size/sha256 at the
# build boundary, upload single-file artifacts with immutable IDs, verify
# the exact downloaded bytes on hosted and hosted-container
# native/compatibility lanes — every lane downloading the candidate by this
# run's immutable artifact ID — and only when the matrix's required
# (gate, lane) closure holds emit the canonical manifest and SHA256SUMS as
# the moor-release-candidate-v1 metadata artifact, exposing its immutable ID
# as a machine-readable output. Every lane of the matrix runs on a hosted
# runner, so the manifest's coverage object always states the full matrix.
#
# Promotion is a separate, later workflow: nothing here creates a tag or a
# release, and every gate fails closed. Every required (gate, lane) is proved
# inside this one run — hosted and hosted-container (Alpine) — and each
# verifier downloads the candidate by THIS run's immutable artifact ID, so
# provenance is bound to the run with no cross-run record ingestion. The
# assembler refuses a candidate missing any required lane.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-hex source commit all four assets are built from
        required: true
      version:
        description: Proposed release version and tag name (vMAJOR.MINOR.PATCH)
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ inputs.commit }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate candidate identity
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      bare: ${{ steps.check.outputs.bare }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Validate commit, version, and crate identity
        id: check
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          BARE="${VERSION#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "moor") | .version')"
          test "$CRATE" = "$BARE"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"

      - name: Run the deterministic verifier and assembler test suites
        run: |
          python3 scripts/candidate-verify.py self-test
          python3 scripts/candidate-manifest-test.py

  build:
    name: Build ${{ matrix.target }}
    if: github.run_attempt == 1
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            suffix: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: macos-x64
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: macos-arm64
    env:
      # Frozen macOS deployment target (docs/release-matrix.md); inert
      # elsewhere.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Install the toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          if [ "${TARGET%-musl}" != "$TARGET" ]; then
            sudo apt-get update -q
            sudo apt-get install -qy musl-tools
          fi

      - name: Build the release binary once
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --bin moor --target "$TARGET"

      - name: Name the asset and establish its identity
        id: identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          BARE: ${{ needs.validate.outputs.bare }}
        run: |
          SOURCE="target/$TARGET/release/moor"
          ASSET="moor-$BARE-$SUFFIX"
          mkdir candidate-out
          cp "$SOURCE" "candidate-out/$ASSET"
          if command -v sha256sum >/dev/null; then
            SHA="$(sha256sum "candidate-out/$ASSET" | cut -d' ' -f1)"
          else
            SHA="$(shasum -a 256 "candidate-out/$ASSET" | cut -d' ' -f1)"
          fi
          SIZE="$(wc -c < "candidate-out/$ASSET" | tr -d ' ')"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Prove the platform binary policy on the built bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ steps.identity.outputs.asset }}
        run: |
          case "$TARGET" in
            *apple-darwin) python3 scripts/candidate-verify.py macho-minos "candidate-out/$ASSET" 13.0 ;;
            *) echo "policy proof for $TARGET runs in the static-linkage gate" ;;
          esac

      - name: Upload the single-file candidate artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moor-candidate-${{ matrix.target }}
          path: candidate-out/${{ steps.identity.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record the build reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ steps.identity.outputs.asset }}
          SHA256: ${{ steps.identity.outputs.sha256 }}
          SIZE: ${{ steps.identity.outputs.size }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          JOB_NAME: Build ${{ matrix.target }}
        run: |
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"$JOB_NAME\") | .id")"
          test -n "$JOB_ID"
          mkdir records
          jq -n \
            --arg asset "$ASSET" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --arg artifactId "$ARTIFACT_ID" \
            --arg artifactName "moor-candidate-$TARGET" \
            --arg runId "${{ github.run_id }}" \
            --argjson attempt "${{ github.run_attempt }}" \
            --arg jobId "$JOB_ID" \
            --arg jobName "$JOB_NAME" \
            '{asset: $asset, sha256: $sha256, size: $size,
              artifactId: $artifactId, artifactName: $artifactName,
              workflowRunId: $runId, workflowRunAttempt: $attempt,
              jobId: $jobId, jobName: $jobName}' \
            > "records/build-$TARGET.json"

      - name: Upload the build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-build-${{ matrix.target }}
          path: records/build-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify ${{ matrix.target }} / ${{ matrix.gate }} / ${{ matrix.lane }}
    if: github.run_attempt == 1
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # identity — status 0, empty stderr, stdout byte-exact
          # '<asset-basename> <bare>\n' per spec §3 and OB-29.
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, gate: identity, lane: ubuntu-22.04-x64}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, gate: identity, lane: ubuntu-24.04-arm64}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, gate: identity, lane: macos-15-intel}
          - {target: aarch64-apple-darwin, runner: macos-15, gate: identity, lane: macos-15-arm64}
          # static-linkage — Linux: no interpreter/deps on the exact bytes.
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, gate: static-linkage, lane: ubuntu-22.04-x64}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, gate: static-linkage, lane: ubuntu-24.04-arm64}
          # native-conformance — §12.8 suites against the exact bytes; each
          # green job also proves its lane's exact-byte compatibility and
          # emits both records.
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, gate: native-conformance, lane: ubuntu-22.04-x64, compat: 'true'}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, gate: native-conformance, lane: ubuntu-24.04-arm64, compat: 'true'}
          - {target: x86_64-apple-darwin, runner: macos-15-intel, gate: native-conformance, lane: macos-15-intel, compat: 'true'}
          - {target: aarch64-apple-darwin, runner: macos-15, gate: native-conformance, lane: macos-15-arm64, compat: 'true'}
          # compatibility-only container lanes (Alpine musl) run in the
          # separate compat-alpine job below.
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Download the build record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: record-build-${{ matrix.target }}
          path: records

      - name: Verify the artifact's GitHub metadata independently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          ARTIFACT_ID="$(jq -r .artifactId "records/build-$TARGET.json")"
          echo "$ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" > artifact.json
          test "$(jq -r .name artifact.json)" = "moor-candidate-$TARGET"
          test "$(jq -r .expired artifact.json)" = "false"
          test "$(jq -r .workflow_run.id artifact.json)" = "${{ github.run_id }}"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_ENV"

      - name: Download by immutable ID and enforce the exact archive shape
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > candidate.zip
          python3 scripts/candidate-verify.py zip-inventory candidate.zip "$ASSET"
          mkdir exact && (cd exact && unzip -q ../candidate.zip)
          test "$(find exact -mindepth 1 | wc -l | tr -d ' ')" = 1
          test -f "exact/$ASSET" && test ! -h "exact/$ASSET"
          if command -v sha256sum >/dev/null; then
            SHA="$(sha256sum "exact/$ASSET" | cut -d' ' -f1)"
          else
            SHA="$(shasum -a 256 "exact/$ASSET" | cut -d' ' -f1)"
          fi
          test "$SHA" = "$(jq -r .sha256 "records/build-$TARGET.json")"
          test "$(wc -c < "exact/$ASSET" | tr -d ' ')" = "$(jq -r .size "records/build-$TARGET.json")"
          chmod +x "exact/$ASSET" || true

      - name: 'Gate: identity (byte-exact, with adversarial self-checks)'
        if: matrix.gate == 'identity'
        shell: bash
        env:
          BARE: ${{ needs.validate.outputs.bare }}
          TARGET: ${{ matrix.target }}
        run: |
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          printf '%s %s\n' "$ASSET" "$BARE" > expected.bin
          # The comparison itself must be able to fail: prove it on
          # adversarial variants before trusting it on the real output.
          printf 'x%s %s\n' "$ASSET" "$BARE" > bad1.bin
          printf '%s %s' "$ASSET" "$BARE" > bad2.bin
          printf '%s %s\n\n' "$ASSET" "$BARE" > bad3.bin
          printf '%s %s\nextra\n' "$ASSET" "$BARE" > bad4.bin
          for bad in bad1.bin bad2.bin bad3.bin bad4.bin; do
            if cmp -s expected.bin "$bad"; then echo "self-check failed: $bad"; exit 1; fi
          done
          set +e
          "./exact/$ASSET" --version > out.bin 2> err.bin
          STATUS=$?
          set -e
          test "$STATUS" -eq 0
          test ! -s err.bin
          cmp expected.bin out.bin

      - name: 'Gate: static linkage (Linux)'
        if: matrix.gate == 'static-linkage' && contains(matrix.target, 'linux')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          file "exact/$ASSET" | tee file.txt
          grep -Eq 'statically linked|static-pie linked' file.txt
          if readelf -l "exact/$ASSET" | grep -q INTERP; then
            echo 'dynamic interpreter present' >&2; exit 1
          fi
          if ldd "exact/$ASSET" 2>&1 | tee ldd.txt | grep -q '=>'; then
            echo 'shared-library dependency present' >&2; exit 1
          fi

      - name: 'Gate: platform binary policy on the exact bytes'
        if: matrix.gate == 'native-conformance'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          case "$TARGET" in
            *apple-darwin) python3 scripts/candidate-verify.py macho-minos "exact/$ASSET" 13.0 ;;
            *) true ;;
          esac

      - name: 'Gate: native conformance (§12.8) with a build-once boundary proof'
        if: matrix.gate == 'native-conformance'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET" || true
          if [ "${TARGET%-musl}" != "$TARGET" ]; then
            sudo apt-get update -q && sudo apt-get install -qy musl-tools
          fi
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          SHA_EXPECTED="$(jq -r .sha256 "records/build-$TARGET.json")"
          cargo test --release --target "$TARGET" --no-run --message-format=json \
            > build.json 2> build.log || { cat build.log >&2; exit 1; }
          BIN="target/$TARGET/release/moor"
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable // empty' \
            build.json > tests.txt
          test -s tests.txt
          hash_of() {
            if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d' ' -f1
            else shasum -a 256 "$1" | cut -d' ' -f1; fi
          }
          # Boundary proof (negative): with a wrong program at that path the
          # suite must fail, proving the fixtures execute those exact bytes.
          # The wrong program is a freshly written real regular file that
          # always exits nonzero — not a shell builtin — so `cp` cannot fail
          # to stat it, and a non-executable stand-in still fails the run,
          # which is the point.
          cp "$BIN" moor.compiled
          printf '#!/bin/sh\nexit 7\n' > wrong-program
          chmod +x wrong-program
          cp wrong-program "$BIN"
          test "$(hash_of "$BIN")" != "$SHA_EXPECTED"
          NEGATIVE_FAILED=0
          while IFS= read -r exe; do
            if ! "$exe" > /dev/null 2>&1; then NEGATIVE_FAILED=1; break; fi
          done < tests.txt
          test "$NEGATIVE_FAILED" -eq 1
          # Replace with the exact candidate bytes; nothing below invokes
          # Cargo again, so no rebuild can substitute the binary.
          cp "exact/$ASSET" "$BIN"
          test "$(hash_of "$BIN")" = "$SHA_EXPECTED"
          while IFS= read -r exe; do
            echo "== $exe"
            "$exe"
          done < tests.txt
          # Final proof: the bytes under test never changed across the run.
          test "$(hash_of "$BIN")" = "$SHA_EXPECTED"

      - name: Record the verification reference(s)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          GATE: ${{ matrix.gate }}
          LANE: ${{ matrix.lane }}
          ALSO_COMPAT: ${{ matrix.compat }}
          COMMIT: ${{ inputs.commit }}
          JOB_NAME: Verify ${{ matrix.target }} / ${{ matrix.gate }} / ${{ matrix.lane }}
        run: |
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"$JOB_NAME\") | .id")"
          test -n "$JOB_ID"
          SHA="$(jq -r .sha256 "records/build-$TARGET.json")"
          mkdir -p records-out
          emit() {
            jq -n \
              --arg gate "$1" --arg lane "$LANE" --arg commit "$COMMIT" \
              --arg sha256 "$SHA" \
              --arg runId "${{ github.run_id }}" \
              --argjson attempt "${{ github.run_attempt }}" \
              --arg jobId "$JOB_ID" --arg jobName "$JOB_NAME" \
              '{gate: $gate, lane: $lane, commit: $commit, sha256: $sha256,
                workflowRunId: $runId, workflowRunAttempt: $attempt,
                jobId: $jobId, jobName: $jobName}' \
              > "records-out/verify-$TARGET-$1-$LANE.json"
          }
          emit "$GATE"
          if [ "$ALSO_COMPAT" = "true" ]; then emit compatibility; fi

      - name: Upload the verification record(s)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-verify-${{ matrix.target }}-${{ matrix.gate }}-${{ matrix.lane }}
          path: records-out/
          if-no-files-found: error
          retention-days: 30

  compat-alpine:
    name: Compatibility ${{ matrix.target }} / ${{ matrix.lane }}
    if: github.run_attempt == 1
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, lane: alpine-3.20-x64}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, lane: alpine-3.20-arm64}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Download the build record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: record-build-${{ matrix.target }}
          path: records

      - name: Verify metadata, download by ID, enforce shape and digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          ARTIFACT_ID="$(jq -r .artifactId "records/build-$TARGET.json")"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" > artifact.json
          test "$(jq -r .name artifact.json)" = "moor-candidate-$TARGET"
          test "$(jq -r .expired artifact.json)" = "false"
          test "$(jq -r .workflow_run.id artifact.json)" = "${{ github.run_id }}"
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          python3 scripts/candidate-verify.py zip-inventory candidate.zip "$ASSET"
          mkdir exact && (cd exact && unzip -q ../candidate.zip)
          test "$(sha256sum "exact/$ASSET" | cut -d' ' -f1)" = "$(jq -r .sha256 "records/build-$TARGET.json")"
          test "$(wc -c < "exact/$ASSET" | tr -d ' ')" = "$(jq -r .size "records/build-$TARGET.json")"
          chmod +x "exact/$ASSET"

      - name: Exercise the exact bytes on the musl host
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BARE: ${{ needs.validate.outputs.bare }}
        run: |
          # A job-level `container:` cannot carry this lane: GitHub supports
          # JavaScript actions in Alpine containers on x64 runners only, so the
          # arm64 lane died during initialisation with "JavaScript Actions in
          # Alpine containers are only supported on x64 Linux runners". The musl
          # work therefore runs through `docker run` from the host — the same
          # mechanism native-hosted.yml already proves on both alpine lanes —
          # which keeps checkout/download/upload executing on the host runner.
          cat > musl-lane.sh <<'LANE'
          set -eu
          apk add --no-cache bash jq musl-dev >/dev/null
          ASSET="$(jq -r .asset "records/build-$TARGET.json")"
          SHA_EXPECTED="$(jq -r .sha256 "records/build-$TARGET.json")"
          printf '%s %s\n' "$ASSET" "$BARE" > expected.bin
          "./exact/$ASSET" --version > out.bin 2> err.bin
          test ! -s err.bin
          cmp expected.bin out.bin
          cargo test --release --target "$TARGET" --no-run --message-format=json \
            > build.json 2> build.log || { cat build.log >&2; exit 1; }
          BIN="target/$TARGET/release/moor"
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable // empty' \
            build.json > tests.txt
          test -s tests.txt
          cp "exact/$ASSET" "$BIN"
          test "$(sha256sum "$BIN" | cut -d' ' -f1)" = "$SHA_EXPECTED"
          while IFS= read -r exe; do
            echo "== $exe"
            "$exe"
          done < tests.txt
          test "$(sha256sum "$BIN" | cut -d' ' -f1)" = "$SHA_EXPECTED"
          LANE
          docker run --rm \
            -e TARGET \
            -e BARE \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rust:1-alpine3.20 /bin/sh -e musl-lane.sh

      - name: Record the compatibility reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          LANE: ${{ matrix.lane }}
          COMMIT: ${{ inputs.commit }}
          JOB_NAME: Compatibility ${{ matrix.target }} / ${{ matrix.lane }}
        run: |
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"$JOB_NAME\") | .id")"
          test -n "$JOB_ID"
          SHA="$(jq -r .sha256 "records/build-$TARGET.json")"
          mkdir -p records-out
          for gate in compatibility native-conformance; do
            jq -n \
              --arg gate "$gate" --arg lane "$LANE" --arg commit "$COMMIT" \
              --arg sha256 "$SHA" \
              --arg runId "${{ github.run_id }}" \
              --argjson attempt "${{ github.run_attempt }}" \
              --arg jobId "$JOB_ID" --arg jobName "$JOB_NAME" \
              '{gate: $gate, lane: $lane, commit: $commit, sha256: $sha256,
                workflowRunId: $runId, workflowRunAttempt: $attempt,
                jobId: $jobId, jobName: $jobName}' \
              > "records-out/verify-$TARGET-$gate-$LANE.json"
          done

      - name: Upload the compatibility record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-compat-${{ matrix.target }}-${{ matrix.lane }}
          path: records-out/
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Emit the canonical candidate metadata
    needs: [validate, build, verify, compat-alpine]
    # Everything mandatory must have succeeded outright.
    if: >-
      github.run_attempt == 1
      && always()
      && needs.validate.result == 'success'
      && needs.build.result == 'success'
      && needs.verify.result == 'success'
      && needs['compat-alpine'].result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      metadata-artifact-id: ${{ steps.metadata.outputs.artifact-id }}
      candidate-record-artifact-id: ${{ steps.record.outputs.artifact-id }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Run the deterministic rejection suites again at assembly time
        run: |
          python3 scripts/candidate-verify.py self-test
          python3 scripts/candidate-manifest-test.py

      - name: Download every build and verification record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: record-*
          path: records-tree
          merge-multiple: true

      - name: Assemble the canonical manifest and SHA256SUMS
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/candidate-manifest.py --records records-tree --out metadata
          # Moor #27 acceptance: canonical LF metadata, four exact lines.
          if grep -q $'\r' metadata/SHA256SUMS; then echo 'CR in SHA256SUMS' >&2; exit 1; fi
          test "$(wc -l < metadata/SHA256SUMS)" = 4
          grep -Ec '^[0-9a-f]{64}  moor-[0-9.]+-(linux|macos)-(x64|arm64)$' metadata/SHA256SUMS | grep -qx 4

      - name: Re-download all four assets by ID and verify on this boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                        x86_64-apple-darwin aarch64-apple-darwin; do
            RECORD="records-tree/build-$target.json"
            ID="$(jq -r .artifactId "$RECORD")"
            ASSET="$(jq -r .asset "$RECORD")"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID" > meta.json
            test "$(jq -r .name meta.json)" = "moor-candidate-$target"
            test "$(jq -r .expired meta.json)" = "false"
            test "$(jq -r .workflow_run.id meta.json)" = "${{ github.run_id }}"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > a.zip
            python3 scripts/candidate-verify.py zip-inventory a.zip "$ASSET"
            (cd assets && unzip -qo ../a.zip)
            rm a.zip
          done
          # Moor #27 acceptance: GNU aggregation-boundary verification of
          # independently recomputed binary hashes.
          (cd assets && sha256sum --check --strict ../metadata/SHA256SUMS)
          # Platform-policy backstop on the exact aggregated bytes.
          python3 scripts/candidate-verify.py macho-minos "assets/$(jq -r .asset records-tree/build-x86_64-apple-darwin.json)" 13.0
          python3 scripts/candidate-verify.py macho-minos "assets/$(jq -r .asset records-tree/build-aarch64-apple-darwin.json)" 13.0

      - name: Upload the two-file metadata artifact
        id: metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moor-release-candidate-v1
          path: metadata/
          if-no-files-found: error
          retention-days: 90

      - name: Round-trip the metadata artifact by its assigned ID
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_ID: ${{ steps.metadata.outputs.artifact-id }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/$METADATA_ID" > meta.json
          test "$(jq -r .name meta.json)" = "moor-release-candidate-v1"
          gh api "repos/${{ github.repository }}/actions/artifacts/$METADATA_ID/zip" > m.zip
          python3 scripts/candidate-verify.py zip-inventory m.zip moor-release-manifest-v1.json SHA256SUMS
          mkdir roundtrip && (cd roundtrip && unzip -q ../m.zip)
          cmp metadata/moor-release-manifest-v1.json roundtrip/moor-release-manifest-v1.json
          cmp metadata/SHA256SUMS roundtrip/SHA256SUMS

      - name: Emit the machine-readable candidate record
        id: emit-record
        env:
          METADATA_ID: ${{ steps.metadata.outputs.artifact-id }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir candidate-record
          jq -n \
            --arg repository "https://github.com/${{ github.repository }}" \
            --arg version "$VERSION" \
            --arg commit "$COMMIT" \
            --arg runId "${{ github.run_id }}" \
            --argjson attempt "${{ github.run_attempt }}" \
            --arg metadataArtifactId "$METADATA_ID" \
            --arg metadataArtifactName "moor-release-candidate-v1" \
            --slurpfile b0 records-tree/build-x86_64-unknown-linux-musl.json \
            --slurpfile b1 records-tree/build-aarch64-unknown-linux-musl.json \
            --slurpfile b2 records-tree/build-x86_64-apple-darwin.json \
            --slurpfile b3 records-tree/build-aarch64-apple-darwin.json \
            '{repository: $repository, version: $version, commit: $commit,
              workflowRunId: $runId, workflowRunAttempt: $attempt,
              metadataArtifactId: $metadataArtifactId,
              metadataArtifactName: $metadataArtifactName,
              targets: ([$b0[0], $b1[0], $b2[0], $b3[0]]
                | map({asset, size, sha256, artifactId, artifactName}))}' \
            > candidate-record/moor-release-candidate-record.json
          jq . candidate-record/moor-release-candidate-record.json

      - name: Upload the candidate record
        id: record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moor-release-candidate-record
          path: candidate-record/moor-release-candidate-record.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish the candidate identity for manual QA
        env:
          METADATA_ID: ${{ steps.metadata.outputs.artifact-id }}
          RECORD_ID: ${{ steps.record.outputs.artifact-id }}
        run: |
          {
            echo '### Release candidate'
            echo
            echo "- commit: \`${{ inputs.commit }}\`"
            echo "- version: \`${{ inputs.version }}\`"
            echo "- run/attempt: \`${{ github.run_id }}\` / \`${{ github.run_attempt }}\`"
            echo "- metadata artifact \`moor-release-candidate-v1\`: id \`$METADATA_ID\`"
            echo "- candidate record artifact: id \`$RECORD_ID\`"
            echo
            echo 'Full manual QA must retrieve the metadata artifact by this'
            echo 'immutable ID and each binary by the artifact IDs it names.'
          } >> "$GITHUB_STEP_SUMMARY"
